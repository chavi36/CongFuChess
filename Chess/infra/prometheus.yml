global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: edge-gateway
    static_configs:
      - targets: ["edge-gateway:9100"]

  - job_name: game-node
    static_configs:
      - targets: ["game-node:9100"]

  - job_name: matchmaker
    static_configs:
      - targets: ["matchmaker:9100"]

  - job_name: allocator
    static_configs:
      - targets: ["allocator:9100"]

  - job_name: spectator-relay
    static_configs:
      - targets: ["spectator-relay:9100"]

  - job_name: result-writer
    static_configs:
      - targets: ["result-writer:9100"]

  - job_name: nats
    static_configs:
      - targets: ["nats:8222"]
