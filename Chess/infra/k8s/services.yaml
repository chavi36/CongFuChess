---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-writer
  labels:
    app: result-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-writer
  template:
    metadata:
      labels:
        app: result-writer
    spec:
      containers:
        - name: result-writer
          image: kungfu-chess/python-services:latest
          command: ["python", "-m", "services.result_writer.main"]
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: nats-secret
                  key: url
            - name: DB_FILENAME
              value: "/data/kungfu_chess.db"
          volumeMounts:
            - name: db-data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
