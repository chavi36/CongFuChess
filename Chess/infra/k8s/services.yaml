---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  labels:
    app: edge-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: edge-gateway
      containers:
        - name: edge-gateway
          image: kungfu-chess/python-services:latest
          command: ["python", "-m", "services.edge_gateway.main"]
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: nats-secret
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
          ports:
            - containerPort: 8081
              name: ws
            - containerPort: 9100
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
