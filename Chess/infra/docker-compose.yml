version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring
    command: ["--jetstream", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.auth.main"]
    environment:
      - DB_FILENAME=/data/kungfu_chess.db
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.api_gateway.main"]
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.edge_gateway.main"]
    ports:
      - "8081:8081"
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  matchmaker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.matchmaker.service"]
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

  allocator:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.allocator.main"]
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  room-manager:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.room_manager.service"]
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  game-node:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gamenode
    environment:
      - NATS_URL=nats://nats:4222
      - SHARDS=4
    depends_on:
      nats:
        condition: service_healthy
    stop_grace_period: 155s   # covers 150 s drain budget

  spectator-relay:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.spectator_relay.main"]
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

  result-writer:
    build:
      context: ..
      dockerfile: infra/Dockerfile.python
    command: ["python", "-m", "services.result_writer.main"]
    environment:
      - NATS_URL=nats://nats:4222
      - DB_FILENAME=/data/kungfu_chess.db
    volumes:
      - db-data:/data
    depends_on:
      nats:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  db-data:
